# Updates arrive grouped: one PR per ecosystem per week for minor/patch
# bumps, so the queue stays reviewable. Major versions still get their own
# PR because they are the ones that need a human look.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/hf_space"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip_hf_space-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker_docker-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/hf_space"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker_hf_space-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
